[package]
name = "scribe-client"
version = "0.1.0"
edition = "2021"
description = "Async client for ElevenLabs Scribe v2 Realtime speech-to-text"

# Standalone on purpose: the main app crate cannot build everywhere, and this one must.
[workspace]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "native-tls"] }
url = "2"

[dev-dependencies]
hound = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

# The bench and its word-error-rate helper carry unit tests; examples skip tests by default.
[[example]]
name = "bench"
test = true
